name: create-sub-issues
on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
jobs:
  create-sub-issues:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'parent') || github.event.inputs.issue_number != ''
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { main } = require('.github/scripts/create-sub-issues/index.js');
            await main(github, context, process.env);
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          PROJECT_NUMBER: 1
